nameOverride: ""
fullnameOverride: ""
replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: digital-bank-java/api-gateway
  tag: "0.0.3"
  pullPolicy: IfNotPresent

runtime:
  profile: sit
  configServerUrl: http://config-server:8888

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    path: /actuator/health/liveness
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

temporaryStorage:
  sizeLimit: 64Mi

terminationGracePeriodSeconds: 30
