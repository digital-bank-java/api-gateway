spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: Retry
              args:
                retries: ${gateway.resilience.retry.retries:2}
                methods: GET,HEAD,OPTIONS
                statuses:
                  - INTERNAL_SERVER_ERROR
                  - BAD_GATEWAY
                  - SERVICE_UNAVAILABLE
                  - GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: ${gateway.resilience.retry.first-backoff:50ms}
                  maxBackoff: ${gateway.resilience.retry.max-backoff:250ms}
                  factor: ${gateway.resilience.retry.factor:2}
                  basedOnPreviousValue: ${gateway.resilience.retry.based-on-previous-value:true}
          httpclient:
            connect-timeout: ${gateway.resilience.timeout.connect-timeout:1000}
            response-timeout: ${gateway.resilience.timeout.response-timeout:2s}

gateway:
  security:
    enabled: ${GATEWAY_SECURITY_ENABLED:false}
  rate-limit:
    trusted-proxies: []
  resilience:
    retry:
      retries: 2
      first-backoff: 50ms
      max-backoff: 250ms
      factor: 2
      based-on-previous-value: true
    timeout:
      connect-timeout: 1000
      response-timeout: 2s
    circuit-breaker:
      sliding-window-type: COUNT_BASED
      sliding-window-size: 20
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10s
      permitted-number-of-calls-in-half-open-state: 2
      automatic-transition-from-open-to-half-open-enabled: true

auth:
  jwt:
    issuer: ${AUTH_JWT_ISSUER:}
    secret: ${AUTH_JWT_SECRET:}
    jwk-set-uri: ${AUTH_JWT_JWK_SET_URI:}

resilience4j:
  circuitbreaker:
    configs:
      gatewayDownstream:
        slidingWindowType: ${gateway.resilience.circuit-breaker.sliding-window-type:COUNT_BASED}
        slidingWindowSize: ${gateway.resilience.circuit-breaker.sliding-window-size:20}
        minimumNumberOfCalls: ${gateway.resilience.circuit-breaker.minimum-number-of-calls:5}
        failureRateThreshold: ${gateway.resilience.circuit-breaker.failure-rate-threshold:50}
        waitDurationInOpenState: ${gateway.resilience.circuit-breaker.wait-duration-in-open-state:10s}
        permittedNumberOfCallsInHalfOpenState: ${gateway.resilience.circuit-breaker.permitted-number-of-calls-in-half-open-state:2}
        automaticTransitionFromOpenToHalfOpenEnabled: ${gateway.resilience.circuit-breaker.automatic-transition-from-open-to-half-open-enabled:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
