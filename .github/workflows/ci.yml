name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  maven-verification:
    name: Maven verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode verify

  helm-validation:
    name: Helm validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm --values helm/values-sit.yaml

      - name: Render chart
        run: helm template api-gateway helm --values helm/values-sit.yaml --namespace digital-bank-sit

  container-smoke-test:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag digital-bank-java/api-gateway:ci .

      - name: Verify non-root user
        run: test "$(docker inspect --format '{{.Config.User}}' digital-bank-java/api-gateway:ci)" = "10001:10001"

      - name: Smoke test container
        run: |
          docker run --detach \
            --name digital-bank-java-api-gateway-ci \
            --publish 8080:8080 \
            --env SPRING_CLOUD_CONFIG_ENABLED=false \
            digital-bank-java/api-gateway:ci

          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health/liveness; then
              docker logs digital-bank-java-api-gateway-ci
              docker stop digital-bank-java-api-gateway-ci
              docker rm digital-bank-java-api-gateway-ci
              exit 0
            fi

            if ! docker ps --filter name=digital-bank-java-api-gateway-ci --format '{{.Names}}' | grep -q '^digital-bank-java-api-gateway-ci$'; then
              docker logs digital-bank-java-api-gateway-ci
              docker rm digital-bank-java-api-gateway-ci
              exit 1
            fi

            sleep 2
          done

          docker logs digital-bank-java-api-gateway-ci
          docker stop digital-bank-java-api-gateway-ci || true
          docker rm digital-bank-java-api-gateway-ci || true
          exit 1
